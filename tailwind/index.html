<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-400">
    <div
      class="bg-white w-1/2 flex mx-auto mt-8 rounded-lg p-8 gap-8"
    >
      <!--left side-->
      <section class="w-1/2 flex flex-col gap-4">
        <h2 class="text-xl font-bold">Update Variables</h2>

        <label for="nameInput" class="text-lg font-medium"
          >Name (String):</label
        >
        <input
          type="text"
          class="w-80  p-1 text-lg rounded-sm border outline-none focus:ring-2 focus:ring-indigo-500 transition"
          id="nameInput"
        />

        <label for="ageInput" class="text-lg font-medium">Age (Number):</label>
        <input
          type="text"
          class="w-80  p-1 text-lg rounded-sm border focus:ring-2 focus:ring-indigo-500 transition outline-none"
          id="ageInput"
        />

        <label for="vipInput" class="text-lg font-medium"
          >VIP Status(Boolean):</label
        >
        <input type="checkbox" id="vipInput" />

        <label for="colorInput" class="text-lg font-medium">Card Color:</label>
        <input type="color" class="h-6 rounded-sm p-2" id="colorInput" />
      </section>
      <!--right side-->
      <section class="w-1/2 flex flex-col gap-6">
        <h2 class="text-xl font-bold">Live DOM Output</h2>
        <div
          id="colorCard"
          class="flex flex-col gap-4 rounded-lg border-2 border-black w-60 p-6"
        >
          <div class="">
            <span
              id="vipBadge"
              class="hidden bg-yellow-500 text-black font-medium px-2 py-1 rounded-2xl"
              >VIP MEMBER</span
            >
          </div>
          <div class="flex flex-col gap-4 break-all">
            <p id="nameOutput" class="text-lg font-bold"></p>
            <p>Age:<span id="ageOutput" class="text-md"></span></p>
          </div>
        </div>
      </section>
    </div>
  </body>
  <script>
    const nameInput = document.getElementById("nameInput");
    const ageInput = document.getElementById("ageInput");
    const vipInput = document.getElementById("vipInput");
    const colorInput = document.getElementById("colorInput");

    const nameOutput = document.getElementById("nameOutput");
    const ageOutput = document.getElementById("ageOutput");
    const vipBadge = document.getElementById("vipBadge");
    const box = document.getElementById("colorCard");

    //Name update
    nameInput.addEventListener("input", () => {
      nameOutput.textContent = nameInput.value;
    });

    // Age update
    ageInput.addEventListener("input", () => {
      ageOutput.textContent = ageInput.value;
    });

    // VIP checkbox
    vipInput.addEventListener("change", () => {
      if (vipInput.checked) {
        vipBadge.style.display = "inline-block";
      } else {
        vipBadge.style.display = "none";
      }
    });

    // Color change
    colorInput.addEventListener("input", () => {
      box.style.backgroundColor = colorInput.value;
    });
  </script>
</html>
