<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phone Calculator</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: gray;
      }

      .container {
        width: 300px;
        height: 500px;
        background-color: white;
        /* display:flex;
            justify-content:center;
            align-items:center; */
        margin: auto;
        margin-top: 80px;
        border-radius: 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .display {
        /* width: 100%;
        height: 100%; */
        border: none;
        outline: none;
        margin: 20px;
        /* background-color: red; */
        text-align: right;
        padding-top: 50px;
        font-size: 30px;
        color: blue;
      }

      .main {
        /* background-color:green; */
        height: 100%;
        display: grid;
        grid-template-columns: auto auto auto auto;
        /* justify-content: flex-end; */
        gap: 15px;
        align-content: end;
        padding: 20px;
      }

      .btn {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        border: none;
        background-color: rgb(214, 231, 237);
        color: blue;
        font-size: 20px;
      }

      .operator {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        border: none;
        background-color: rgb(214, 231, 237);
        color: rgb(195, 26, 54);
        /* font-weight:bold; */
        font-size: 20px;
      }

      .ope{
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background-color: rgb(211, 111, 127);
        color:white;
        border:none;
        font-weight: bold;
         font-size: 20px;
      }

      .line {
        width: 120px;
        height: 5px;
        background-color: gray;
        /* text-align:center; */
        margin: auto;
        margin-bottom: 5px;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <input type="text" class="display" id="display" value="0" />
      <div class="main">
        <button class="operator" onclick="clearAll()">C</button>
        <button class="operator" onclick="deleteOne()">⌫</button>
        <button class="btn" onclick="appendValue('%')">%</button>
        <button class="operator" onclick="appendValue('/')">÷</button>

        <button class="btn" onclick="appendValue('7')">7</button>
        <button class="btn" onclick="appendValue('8')">8</button>
        <button class="btn" onclick="appendValue('9')">9</button>
        <button class="operator" onclick="appendValue('*')">*</button>

        <button class="btn" onclick="appendValue('4')">4</button>
        <button class="btn" onclick="appendValue('5')">5</button>
        <button class="btn" onclick="appendValue('6')">6</button>
        <button class="operator" onclick="appendValue('-')">-</button>

        <button class="btn" onclick="appendValue('1')">1</button>
        <button class="btn" onclick="appendValue('2')">2</button>
        <button class="btn" onclick="appendValue('3')">3</button>
        <button class="operator" onclick="appendValue('+')">+</button>

        <button class="btn" onclick="appendBracket()">()</button>
        <button class="btn" onclick="appendValue('0')">0</button>
        <button class="btn" onclick="appendValue('.')">.</button>
        <button class="ope" onclick="calculate()">=</button>
      </div>
      <div class="line"></div>
    </div>

    <script>
      let display = document.getElementById("display");
      function appendValue(value) {
        // let operators = ["+", "-", "*", "/", "%" ,"."];
        // let lastChar = display.value.slice(-1);

        // if (operators.includes(value) && operators.includes(lastChar)) {
        //   //display.value = display.value.slice(0, -1) + value;
        //   return;
        // }

        // if (display.value === "0" ) {
        //   display.value = value;
        // } else {
        //   display.value += value;
        // }

        // let operators = ["+", "-", "*", "/", "%" ,"."];

        // let lastChar = display.value.slice(-1);

        // // operator နှစ်ခါမထည့်စေချင်
        // if (operators.includes(value) && operators.includes(lastChar)) {
        //   return;
        // }

        // // 0 ရှိနေရင် number ပဲအစားထိုး
        // if (display.value === "0") {
        //   if (operators.includes(value)) {
        //     return;
        //   } else {
        //     display.value = value;
        //     return;
        //   }
        // }

        // display.value += value;

        let operators = ["+", "-", "*", "/", "%", "."];

        let start = display.selectionStart;

        let beforeCursor = display.value[start - 1];

        
        if (operators.includes(value) && operators.includes(beforeCursor)) {
          return;
        }

        if (display.value === "0" && !operators.includes(value)) {
          display.value = value;
          return;
        }

      
        display.setRangeText(value, start, start, "end");

        display.focus();

        // updateCursor();
      }

      function clearAll() {
        display.value = "0";
        // display.focus();
        // display.setSelectionRange(display.value.length, display.value.length);
      }

      function deleteOne() {
        // if(display.value.length >1){
        //   display.value=display.value.slice(0,-1);
        // }else{
        //   display.value="0";
        // }
        display.value =
          display.value.length > 1 ? display.value.slice(0, -1) : "0";

        //updateCursor();
      }

      function calculate() {
        //display.value=Function("return" +display.value)();
        //display.value=eval(display.value);
        // try {
        //   display.value ="=" + eval(display.value);
        // } catch {
        //   display.value = "Error";
        // }
        try {
          let currentValue = display.value;

          if (currentValue.includes("%") && /\d%\d/.test(currentValue)) {
            display.value = "=" + eval(currentValue);
          } else {
            let newValue = currentValue.replace(/%/g, "/100");
            // let result=Number(currentValue/100);

            let result = eval(newValue);

            display.value = "=" + result;
          }

          // let newValue=currentValue.replace(/%/g,'/100');

          // let result=eval(newValue);

          // display.value="=" + result;
        } catch {
          display.value = "Error";
        }
      }

      function appendBracket() {
        let str = display.value;

        let openCount = str.split("(").length - 1;

        let closeCount = str.split(")").length - 1;

        let lastValue = str.slice(-1);

        if (openCount > closeCount && !isNaN(lastValue)) {
          display.value = display.value + ")";
        } else {
          if (display.value === "0") {
            display.value = "(";
          } else {
            display.value = display.value + "(";
          }
        }
      }

      // function updateCursor() {
      //   display.focus();
      //   display.setSelectionRange(display.value.length, display.value.length);
      // }
    </script>
  </body>
</html>
