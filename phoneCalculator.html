<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phone Calculator</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: gray;
      }

      .container {
        width: 300px;
        height: 500px;
        background-color: white;
        /* display:flex;
            justify-content:center;
            align-items:center; */
        margin: auto;
        margin-top: 80px;
        border-radius: 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .display {
        /* width: 100%;
        height: 100%; */
        border: none;
        outline: none;
        margin: 20px;
        /* background-color: red; */
        text-align: right;
        padding-top: 50px;
        font-size: 30px;
        color: blue;
      }

      .main {
        /* background-color:green; */
        height: 100%;
        display: grid;
        grid-template-columns: auto auto auto auto;
        /* justify-content: flex-end; */
        gap: 15px;
        align-content: end;
        padding: 20px;
      }

      .btn {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        border: none;
        background-color: rgb(214, 231, 237);
        color: blue;
        font-size: 20px;
      }

      .operator {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        border: none;
        background-color: rgb(214, 231, 237);
        color: rgb(195, 26, 54);
        /* font-weight:bold; */
        font-size: 20px;
      }

      .ope {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background-color: rgb(211, 111, 127);
        color: white;
        border: none;
        font-weight: bold;
        font-size: 20px;
      }

      .line {
        width: 120px;
        height: 5px;
        background-color: gray;
        /* text-align:center; */
        margin: auto;
        margin-bottom: 5px;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <input type="text" class="display" id="display" value="0" />
      <div class="main">
        <button class="operator" onclick="clearAll()">C</button>
        <button class="operator" onclick="deleteOne()">⌫</button>
        <button class="btn" onclick="appendValue('%')">%</button>
        <button class="operator" onclick="appendValue('/')">÷</button>

        <button class="btn" onclick="appendValue('7')">7</button>
        <button class="btn" onclick="appendValue('8')">8</button>
        <button class="btn" onclick="appendValue('9')">9</button>
        <button class="operator" onclick="appendValue('*')">*</button>

        <button class="btn" onclick="appendValue('4')">4</button>
        <button class="btn" onclick="appendValue('5')">5</button>
        <button class="btn" onclick="appendValue('6')">6</button>
        <button class="operator" onclick="appendValue('-')">-</button>

        <button class="btn" onclick="appendValue('1')">1</button>
        <button class="btn" onclick="appendValue('2')">2</button>
        <button class="btn" onclick="appendValue('3')">3</button>
        <button class="operator" onclick="appendValue('+')">+</button>

        <button class="btn" onclick="appendBracket()">()</button>
        <button class="btn" onclick="appendValue('0')">0</button>
        <button class="btn" onclick="appendValue('.')">.</button>
        <button class="ope" onclick="calculate()">=</button>
      </div>
      <div class="line"></div>
    </div>

    <script>
      function appendValue(value) {
        let operators = ["+", "-", "*", "/", "%", "."];

        let start = display.selectionStart;
        let end = display.selectionEnd;
        let charBefore = display.value.substring(start - 1, start);

        if (operators.includes(value) && operators.includes(charBefore)) {
          return;
        }

        if (display.value === "0" && !operators.includes(value)) {
          display.value = value;
          display.setSelectionRange(1, 1);
        } else {
          display.setRangeText(value, start, end, "end");
        }

        display.focus();
      }
      // updateCursor();

      function clearAll() {
        display.value = "0";
        display.focus();
        display.setSelectionRange(1, 1);
      }

      function deleteOne() {
        let start = display.selectionStart;
        let end = display.selectionEnd;

        if (display.value.includes("=") || display.value === "Error") {
          display.value = "0";
          display.setSelectionRange(1, 1);
        } else {
          if (start === end && start > 0) {
            display.value =
              display.value.substring(0, start - 1) +
              display.value.substring(end);
            display.setSelectionRange(start - 1, start - 1);
          } else {
            display.setRangeText("", start, end, "end");
          }

          if (display.value === "") display.value = "0";
        }
        display.focus();

        //updateCursor();
      }

      function calculate() {
        let val = display.value;
        if (val === "0" || val.includes("=") || val === "") return;

        try {
          if (/%[0-9]/.test(val)) {
            //throw new Error("Modulus not allowed");
            return;
          }

          let expression = val.replace(/÷/g, "/").replace(/%/g, "/100");
          let result = eval(expression);

          if (!Number.isInteger(result)) {
            result = parseFloat(result.toFixed(8));
          }

          display.value = result;
          display.focus();
          display.setSelectionRange(display.value.length, display.value.length);
        } catch (e) {
          display.value = "Error";
        }
        // display.focus();
      }

      function appendBracket() {
        if (display.value.startsWith("=")) display.value = "";

        let start = display.selectionStart;
        let end = display.selectionEnd;

        let str = display.value;

        let openCount = str.split("(").length - 1;

        let closeCount = str.split(")").length - 1;

        let charBefore = str.substring(start - 1, start);

        let bracket = "";

        if (
          openCount > closeCount &&
          charBefore !== "" &&
          !isNaN(charBefore) &&
          charBefore !== "("
        ) {
          bracket = ")";
        } else {
          bracket = "(";
        }

        if (display.value === "0") {
          display.value = bracket;
          display.setSelectionRange(1, 1);
        } else {
          display.setRangeText(bracket, start, end, "end");
        }

        display.focus();
      }
    </script>
  </body>
</html>
