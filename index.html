<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: gray;
        box-sizing: border-box;
      }
      .content {
        margin: auto;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        column-gap: 5rem;
        background-color: aquamarine;
        width: 500px;
        height:300px;
        margin-top: 50px;
        border-radius: 0.5rem;
        padding: 5px 50px;
      }

      .main {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .user-input {
        width: 200px;
        border-radius: 0.3rem;
        padding: 5px;
      }

      .color {
        height: 20px;
        border: 1px solid black;
        padding: 10px 10px;
        border-radius: 0.3rem;
      }

      .card {
        border: 2px solid black;
        /*padding: 5px 5px;*/
        border-radius: 0.5rem;
        padding: 10px 10px;
      }
      .vip {
        background-color: yellow;
        border-radius: 1rem;
        padding: 5px 5px;
        font-size: 1rem;
        display: none;
      }

      /* .box h2 {
        row-gap: 0.5rem;
      } */
    </style>
  </head>
  <body>
    <div class="content">
      <!--left side-->
      <section class="main">
        <h2>Update Variables</h2>

        <label for="nameInput">Name (String):</label>
        <input type="text" class="user-input" id="nameInput" />

        <label for="ageInput">Age (Number):</label>
        <input type="number" class="user-input" id="ageInput" />

        <label for="vipInput">VIP Status(Boolean):</label>
        <input type="checkbox" class="check" id="vipInput" />

        <label for="colorInput">Card Color:</label>
        <input type="color" class="color" id="colorInput" />
      </section>
      <!--right side-->
      <section class="output">
        <h2>Live DOM Output</h2>
        <!-- <div class="box" id="colorCard">
          <span id="vipBadge" class="vip">VIP MEMBER</span>
          <h3 id="nameOutput"></h3>
          <p>Age:<span id="ageOutput"></span></p>
        </div> -->
        <div id="colorCard" class="card">
          <div class="card-header" >
            <span id="vipBadge" class="vip">VIP MEMBER</span>
          </div>
          <div class="card-body">
            <p id="nameOutput"></p>
            <p>Age:<span id="ageOutput"></span></p>
          </div>
        </div>
      </section>
    </div>
  </body>
  <script>
    const nameInput = document.getElementById("nameInput");
    const ageInput = document.getElementById("ageInput");
    const vipInput = document.getElementById("vipInput");
    const colorInput = document.getElementById("colorInput");

    const nameOutput = document.getElementById("nameOutput");
    const ageOutput = document.getElementById("ageOutput");
    const vipBadge = document.getElementById("vipBadge");
    const box = document.getElementById("colorCard");

    //Name update
    nameInput.addEventListener("input", () => {
      nameOutput.textContent = nameInput.value;
    });

    // Age update
    ageInput.addEventListener("input", () => {
      ageOutput.textContent = ageInput.value;
    });

    // VIP checkbox
    vipInput.addEventListener("change", () => {
      if (vipInput.checked) {
        vipBadge.style.display = "inline-block";
      } else {
        vipBadge.style.display = "none";
      }
    });

    // Color change
    colorInput.addEventListener("input", () => {
      box.style.backgroundColor = colorInput.value;
    });
  </script>
</html>
